# Source-build overlay: build the app from this checkout instead of pulling the release image.
# docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  app:
    image: ${ASEO_BUILD_IMAGE:-agentic-seo:local}
    build:
      context: .
      args:
        # Reported as `commit` by /healthz; empty for a build outside a git checkout.
        GIT_SHA: ${ASEO_GIT_SHA:-}
