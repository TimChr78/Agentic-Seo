<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111512" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Agentic SEO is an open-source, agent-first search operations platform: audits, issues and evidence-backed recommendations, with people in control."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agentic SEO" />
    <meta property="og:title" content="Agentic SEO" />
    <meta
      property="og:description"
      content="Search operations with people in control. Every audit, recommendation and change is evidence-backed and audited."
    />
    <meta property="og:image" content="/brand/social-preview.svg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="The Agentic SEO mark and wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agentic SEO" />
    <meta
      name="twitter:description"
      content="Search operations with people in control. Every audit, recommendation and change is evidence-backed and audited."
    />
    <meta name="twitter:image" content="/brand/social-preview.svg" />
    <title>Agentic SEO</title>
    <script>
      // Theme and desktop-navigation preference before first paint (docs/design/DESIGN.md → Themes,
      // Layout): the signed-in person's choice on this device, else the last choice made here, else
      // the OS preference. Kept in sync by src/app/theme.ts and src/app/prefs.ts.
      (() => {
        var u;
        var pref;
        var dark;
        var nav;
        try {
          u = localStorage.getItem('as.theme.user');
          pref = (u && localStorage.getItem(`as.theme.${u}`)) || localStorage.getItem('as.theme') || 'system';
          dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          nav = (u && localStorage.getItem(`as.nav.${u}`)) || 'expanded';
          document.documentElement.setAttribute('data-nav', nav === 'collapsed' ? 'collapsed' : 'expanded');
        } catch {
          // Storage can be unavailable (private mode, blocked cookies); fall back to the defaults.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
