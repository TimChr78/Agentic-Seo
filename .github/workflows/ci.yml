name: CI

# Static checks, the test suite and the Docker image. Grows with the phases (browser tests, Helm).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aseo
          POSTGRES_PASSWORD: aseo
          POSTGRES_DB: aseo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aseo"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aseo:aseo@localhost:5432/aseo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci

  # The admin UI in a real browser against a real server and a disposable database: the Phase 0
  # journey (sign in, create a site, open its verification screen from the checklist, check
  # ownership) in e2e/journey.spec.ts, and axe (WCAG 2.1/2.2 A and AA) over every route in light
  # and dark in e2e/axe.spec.ts. The Chromium build is cached per Playwright version; the system
  # packages it needs are installed on every run, because they are not part of the cache.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aseo
          POSTGRES_PASSWORD: aseo
          POSTGRES_DB: aseo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aseo"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aseo:aseo@localhost:5432/aseo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # The Docker image as a self-hoster runs it. Building the image here and reusing it in the smoke
  # script keeps one build per run; the script uses Compose, which GitHub's runners have.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: docker buildx build --build-arg GIT_SHA="${GITHUB_SHA::7}" --load -t aseo-smoke-app .
      - run: SMOKE_NO_BUILD=1 SMOKE_IMAGE=aseo-smoke-app scripts/smoke.sh
