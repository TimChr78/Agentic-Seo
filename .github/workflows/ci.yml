name: CI

# Static checks, the test suite and the Docker image. Grows with the phases (browser tests, Helm).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aseo
          POSTGRES_PASSWORD: aseo
          POSTGRES_DB: aseo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aseo"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aseo:aseo@localhost:5432/aseo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci

  # The Docker image as a self-hoster runs it. Building the image here and reusing it in the smoke
  # script keeps one build per run; the script uses Compose, which GitHub's runners have.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: docker buildx build --build-arg GIT_SHA="${GITHUB_SHA::7}" --load -t aseo-smoke-app .
      - run: SMOKE_NO_BUILD=1 SMOKE_IMAGE=aseo-smoke-app scripts/smoke.sh
